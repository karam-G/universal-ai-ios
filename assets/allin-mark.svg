    <feOffset dy="18" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.08 0 0 0 0 0.34 0 0 0 .65 0" result="shade"/>
    <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
