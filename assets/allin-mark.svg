<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bg" cx="48%" cy="35%" r="78%">
    <stop offset="0" stop-color="#171A42"/>
    <stop offset=".52" stop-color="#090D22"/>
    <stop offset="1" stop-color="#030611"/>
  </radialGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E3D9FF"/>
    <stop offset=".24" stop-color="#A58BFF"/>
    <stop offset=".58" stop-color="#6548D9"/>
    <stop offset="1" stop-color="#35C8EE"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#BDEEFF"/>
    <stop offset=".32" stop-color="#70CFFF"/>
    <stop offset=".68" stop-color="#6B6CF3"/>
    <stop offset="1" stop-color="#D5A6FF"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#4B36C9"/>
    <stop offset=".48" stop-color="#8A72FF"/>
    <stop offset="1" stop-color="#6CE6F4"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".32" stop-color="#D9D0FF"/>
    <stop offset="1" stop-color="#9D7CFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
