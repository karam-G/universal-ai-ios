name: ALLIN iOS Simulator Smoke Test

on:
  push:
    branches:
      - allin/premium-redesign-0.4.0
    paths:
      - "App.tsx"
      - "app/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-simulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allin-simulator-smoke
  cancel-in-progress: false

jobs:
  simulator-smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build and launch on iOS Simulator
        env:
          SIM_DERIVED: ${{ runner.temp }}/ALLINSimulator
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -type d | head -1)
          PROJECT=$(find ios -maxdepth 1 -name '*.xcodeproj' -type d | head -1)
          if [ -n "$WORKSPACE" ]; then
            TARGET_FLAG=-workspace
            TARGET_PATH=$WORKSPACE
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          elif [ -n "$PROJECT" ]; then
            TARGET_FLAG=-project
            TARGET_PATH=$PROJECT
            SCHEME=$(basename "$PROJECT" .xcodeproj)
          else
            echo "::error::No generated iOS workspace or project found"
            exit 1
          fi
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE_ID"
          echo "Simulator device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild "$TARGET_FLAG" "$TARGET_PATH" -scheme "$SCHEME" -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$SIM_DERIVED" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
          APP_PATH=$(find "$SIM_DERIVED/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.karamg.allin
          mkdir -p simulator-shots
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot simulator-shots/01-home.png
          for route in discover daily connect tools privacy profile; do
            xcrun simctl openurl "$DEVICE_ID" "allin:///$route"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "simulator-shots/$route.png"
          done
          echo "Simulator screenshots captured for Home, Discover, Daily, Connect, Tools, Privacy and Profile."
      - name: Upload simulator screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: allin-0.4.0-simulator-smoke
          path: simulator-shots/*.png
          retention-days: 7
