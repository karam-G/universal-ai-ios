<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>Universal AI</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10131b;color:#f1f3f8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#28223f 0%,#10131b 58%)}main{width:min(100%,430px)}.mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#b7a6ff,#7561d6);color:#171326;font-size:30px;font-weight:800;margin-bottom:28px}h1{font-size:30px;margin:0 0 8px}p{color:#a5adbd;line-height:1.55;margin:0 0 28px}.card{background:#191e2a;border:1px solid #303849;border-radius:22px;padding:22px}label{display:block;font-size:13px;color:#c6ccda;margin:0 0 9px}input{width:100%;border:1px solid #394357;background:#111620;color:white;border-radius:12px;padding:15px;font-size:16px;margin-bottom:16px}button{width:100%;border:0;border-radius:12px;padding:16px;background:#aa99ff;color:#171326;font-size:16px;font-weight:750}.secondary{background:transparent;color:#b7a6ff;border:1px solid #394357;margin-top:10px}.status{font-size:13px;color:#a5adbd;min-height:20px;margin-top:14px;overflow-wrap:anywhere}.foot{font-size:12px;color:#737f94;text-align:center;margin-top:20px}
</style></head>
<body><main><div class="mark">✳</div><h1>Universal AI</h1><p>Your assistant runs on your laptop. This iPhone app connects securely to it so your conversations, memory and tools stay in sync.</p><section class="card"><label for="server">Laptop connection URL</label><input id="server" type="url" inputmode="url" autocomplete="url" placeholder="https://your-laptop.trycloudflare.com"><button id="connect">Connect to my laptop</button><button id="clear" class="secondary" hidden>Forget saved connection</button><div id="status" class="status" role="status"></div></section><div class="foot">Both devices must be online. Keep Universal AI running on your laptop.</div></main>
<script>
const $=id=>document.getElementById(id),saved=localStorage.getItem('uai-laptop-url')||'';$('server').value=saved;$('clear').hidden=!saved;
function clean(v){const u=new URL(v.trim());if(u.protocol!=='https:'||!u.hostname.endsWith('.trycloudflare.com'))throw Error('Use the secure Cloudflare HTTPS link shown by Universal AI on your laptop.');if(u.username||u.password||u.pathname!=='/'&&u.pathname!=='')throw Error('Enter only the base server URL.');return u.origin;}
$('connect').onclick=async()=>{let base;try{base=clean($('server').value)}catch(e){$('status').textContent=e.message;return;}$('connect').disabled=true;$('status').textContent='Checking your laptop…';try{const r=await fetch(base+'/api/health',{cache:'no-store'});if(!r.ok)throw Error('Server returned '+r.status);const data=await r.json();if(!data.ok)throw Error('Universal AI server did not respond correctly.');localStorage.setItem('uai-laptop-url',base);$('status').textContent='Connected. Opening Universal AI…';location.href=base+'/';}catch(e){$('status').textContent='Could not reach laptop: '+e.message+' Make sure the laptop server and its secure tunnel are running.';}finally{$('connect').disabled=false;}};
$('clear').onclick=()=>{localStorage.removeItem('uai-laptop-url');$('server').value='';$('clear').hidden=true;$('status').textContent='Saved connection removed.';};
if(saved){$('status').textContent='Saved laptop address. Tap Connect to continue.';}
</script></body></html>
